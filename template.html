<!DOCTYPE html>
<html lang="en">
<head>
    <title>$title$ | $SITE_NAME$</title>
    <meta name="description" content="$desc$">
    <meta property="og:title" content="$title$">
    <meta property="og:description" content="$desc$">
    <meta property="og:image" content="$SITE_URL$/assets/og/$slug$.png">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="$date$">
    <meta property="article:author" content="$SITE_NAME$">
    <link rel="canonical" href="$SITE_URL$/posts/$slug$.html">
<!-- HEAD_COMMON -->
    <style>
$highlighting-css$
    </style>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "$title$",
  "description": "$desc$",
  "datePublished": "$date$",
  "author": {
    "@type": "Person",
    "name": "$SITE_NAME$",
    "url": "$SITE_URL$/"
  },
  "publisher": {
    "@type": "Person",
    "name": "$SITE_NAME$"
  },
  "mainEntityOfPage": "$SITE_URL$/posts/$slug$.html",
  "image": "$SITE_URL$/assets/og/$slug$.png",
  "keywords": "$tags$",
  "wordCount": "$word_count$"
}
    </script>
</head>
<body class="dark-mode">
<!-- NAV -->

    <main id="main-content" class="post-page">
        <article class="post-container container">
            <nav class="post-breadcrumbs" aria-label="Breadcrumb">
                <a href="$ROOT$blog.html">Notes</a>
$if(first_tag)$
                <span class="post-breadcrumb-sep">/</span>
                <a href="$ROOT$blog.html#tag=$first_tag_slug$">$first_tag$</a>
$endif$
                <span class="post-breadcrumb-sep">/</span>
                <span class="post-breadcrumb-current" aria-current="page">$title$</span>
            </nav>
            <header class="post-header">
                <h1 class="post-title">$title$</h1>
                <div class="post-meta">
                    <time class="post-meta-date" datetime="$date$">$date$</time>
                    <span class="post-meta-sep">·</span>
                    <span class="post-meta-tags">$tags$</span>
                    <span class="post-meta-sep">·</span>
                    <span class="post-meta-readtime">$reading_time$ min read</span>
$if(updated)$
                    <span class="post-meta-sep">·</span>
                    <span class="post-meta-updated" title="Last updated">Updated <time datetime="$updated$">$updated$</time></span>
$endif$
                </div>
            </header>

            <div class="post-content">
$body$
            </div>
<!-- POST_NAV -->
        </article>
    </main>

<!-- FOOTER -->
</body>
</html>
