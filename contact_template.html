<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact — $SITE_NAME$</title>
    <meta name="description" content="Email and handles.">
    <meta property="og:title" content="Contact — $SITE_NAME$">
    <meta property="og:description" content="Email and handles.">
    <meta property="og:image" content="$SITE_OG_IMAGE$">
    <meta property="og:url" content="$SITE_URL$/contact.html">
    <link rel="canonical" href="$SITE_URL$/contact.html">
<!-- HEAD_COMMON -->
</head>
<body class="dark-mode">
<!-- NAV -->

    <main id="main-content">
    <section class="contact-page">
        <div class="container">
            <div class="contact-content-page">
                <h1 class="page-title">Get in Touch</h1>
                <p class="page-subtitle">Email is best. I usually respond within 24–48 hours.</p>

                <ul class="env-list">
                    <li>
                        <div class="cmd-block">
                            <pre><a href="https://github.com/$SITE_GITHUB$" target="_blank" rel="noopener noreferrer" class="env-cmd-link">export GITHUB="@$SITE_GITHUB$"</a></pre>
                            <button type="button" class="copy-btn copy-btn--small cmd-copy" data-copy-text="@$SITE_GITHUB$">Copy</button>
                        </div>
                    </li>
                    <li>
                        <div class="cmd-block">
                            <pre><a href="mailto:$SITE_EMAIL$" class="env-cmd-link">export EMAIL="$SITE_EMAIL$"</a></pre>
                            <button type="button" class="copy-btn copy-btn--small cmd-copy" data-copy-text="$SITE_EMAIL$">Copy</button>
                        </div>
                    </li>
                    <li>
                        <div class="cmd-block">
                            <pre><a href="https://www.linkedin.com/in/$SITE_LINKEDIN$/" target="_blank" rel="noopener noreferrer" class="env-cmd-link">export LINKEDIN="$SITE_LINKEDIN$"</a></pre>
                            <button type="button" class="copy-btn copy-btn--small cmd-copy" data-copy-text="$SITE_LINKEDIN$">Copy</button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </section>
    </main>

<!-- FOOTER -->
</body>
</html>
