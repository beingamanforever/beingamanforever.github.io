<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact | $SITE_NAME$</title>
    <meta name="description" content="Email and handles.">
    <meta property="og:title" content="Contact | $SITE_NAME$">
    <meta property="og:description" content="Email and handles.">
    <meta property="og:image" content="$SITE_OG_IMAGE$">
    <meta property="og:url" content="$SITE_URL$/contact.html">
    <link rel="canonical" href="$SITE_URL$/contact.html">
<!-- HEAD_COMMON -->
</head>
<body>
<!-- NAV -->

    <main id="main-content">
    <section class="contact-page">
        <div class="container">
            <div class="contact-content-page">
                <h1 class="page-title">Get in Touch</h1>
                <p class="page-subtitle">Email is best. I usually respond within 24–48 hours.</p>

                <h2 class="contact-section-title">Channels</h2>
                <div class="contact-env">
                    <pre class="contact-env-pre"><span class="contact-env-line"><span class="contact-env-key">export GITHUB=</span><a href="https://github.com/$SITE_GITHUB$" target="_blank" rel="noopener noreferrer" class="env-cmd-link">"@$SITE_GITHUB$"</a></span>
<span class="contact-env-line"><span class="contact-env-key">export EMAIL=</span><a href="mailto:$SITE_EMAIL$" class="env-cmd-link">"$SITE_EMAIL$"</a></span>
<span class="contact-env-line"><span class="contact-env-key">export X=</span><a href="https://x.com/beingamanFF" target="_blank" rel="noopener noreferrer" class="env-cmd-link">"@beingamanFF"</a></span>
<span class="contact-env-line"><span class="contact-env-key">export LINKEDIN=</span><a href="https://www.linkedin.com/in/$SITE_LINKEDIN$/" target="_blank" rel="noopener noreferrer" class="env-cmd-link">"$SITE_LINKEDIN$"</a></span></pre>
                    <button type="button" class="copy-btn copy-btn--small contact-env-copy" data-copy-text='export GITHUB="@$SITE_GITHUB$"
export EMAIL="$SITE_EMAIL$"
export X="@beingamanFF"
export LINKEDIN="$SITE_LINKEDIN$"'>Copy all</button>
                </div>
            </div>
        </div>
    </section>
    </main>

<!-- FOOTER -->
</body>
</html>
