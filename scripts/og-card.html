<!DOCTYPE html>
<!-- Source for assets/og-home-v3.png (1200x630 social preview). Render with headless Chrome; see README. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    @font-face { font-family: "Geist"; src: url("../assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { position: relative; font-family: "Geist", system-ui, sans-serif; color: #18181b; background: linear-gradient(#ffffff 55%, #f7f7f8); -webkit-font-smoothing: antialiased; }
    .top { position: absolute; top: 46px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 26px; }
    .brand svg { width: 58px; height: 58px; }
    h1 { font-size: 66px; font-weight: 450; letter-spacing: -0.045em; line-height: 1; }
    .tagline { margin-top: 14px; color: #52525b; font-size: 25px; letter-spacing: -0.01em; }
    .url { padding: 7px 18px; border: 1px solid #ececee; border-radius: 999px; background: rgba(247, 247, 248, 0.9); color: #52525b; font-size: 17px; }
    .chips { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border: 1px solid; border-radius: 999px; font-size: 17px; font-weight: 500; }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pending { color: #c25a12; background: #fff6ee; border-color: #fbdcc4; }
    .accepted { color: #2f8a3e; background: #f2faf2; border-color: #d3ecd4; }
    .topic { color: #3f5bd8; background: #f2f5ff; border-color: #d8e0fb; }
    .mark { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 380px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.82; color: transparent;
            background: url("../assets/images/wordmark/scene-1.jpg") 50% 62% / 120% auto no-repeat; -webkit-background-clip: text; background-clip: text; }
</style>
</head>
<body>
    <div class="top">
        <span class="url">beingamanforever.github.io</span>
        <div>
            <div class="brand">
                <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#111" stroke-width="3.4" stroke-linejoin="round" transform="translate(32 32)">
                    <ellipse cy="-13.5" rx="7.6" ry="10.5"/><ellipse cy="-13.5" rx="7.6" ry="10.5" transform="rotate(60)"/><ellipse cy="-13.5" rx="7.6" ry="10.5" transform="rotate(120)"/>
                    <ellipse cy="-13.5" rx="7.6" ry="10.5" transform="rotate(180)"/><ellipse cy="-13.5" rx="7.6" ry="10.5" transform="rotate(240)"/><ellipse cy="-13.5" rx="7.6" ry="10.5" transform="rotate(300)"/>
                    <circle r="3.6"/></g></svg>
                <h1>Aman Behera</h1>
            </div>
            <p class="tagline">Data Scientist at HiLabs · agents, RL, document intelligence</p>
            <div class="chips">
                <span class="chip pending"><i></i>LevelHead · CVPR 2027</span>
                <span class="chip accepted"><i></i>2 papers · NeurIPS 2026 workshops</span>
                <span class="chip topic"><i></i>EMNLP 2026</span>
            </div>
        </div>
    </div>
    <div class="mark" aria-hidden="true">aman</div>
</body>
</html>
