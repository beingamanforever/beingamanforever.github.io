<!DOCTYPE html>
<html lang="en">
<head>
    <title>Blog | $SITE_NAME$</title>
    <meta name="description" content="$SITE_DESC$">
    <meta property="og:title" content="Blog | $SITE_NAME$">
    <meta property="og:description" content="$SITE_DESC$">
    <meta property="og:image" content="$SITE_OG_IMAGE$">
    <meta property="og:url" content="$SITE_URL$/blog.html">
    <link rel="canonical" href="$SITE_URL$/blog.html">
<!-- HEAD_COMMON -->
    <script src="assets/js/graph.js?v=$CACHEBUST$" defer></script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "$SITE_URL$/" },
    { "@type": "ListItem", "position": 2, "name": "Blog", "item": "$SITE_URL$/blog.html" }
  ]
}
    </script>
</head>
<body class="dark-mode">
<!-- NAV -->

    <main id="main-content" class="blog-page">
        <div class="container">
            <h1 class="page-title">Notes</h1>
            <p class="page-subtitle">Notes I write to think more clearly, mostly on systems and performance. <a href="feed.xml">Subscribe by RSS</a>.</p>

            <section class="graph-panel" aria-label="Graph view of notes and tags">
                <header class="graph-panel-header">
                    <h2 class="graph-panel-title">Graph view</h2>
                    <span class="graph-panel-hint">drag · scroll to zoom · click a node to open</span>
                </header>
                <div class="graph-stage" id="graph-stage">
                    <svg id="graph-svg" role="img" aria-label="Force-directed graph of notes and tags"></svg>
                    <div class="graph-empty" id="graph-empty" hidden>
                        <p>No notes yet.</p>
                    </div>
                    <div class="graph-legend" aria-hidden="true">
                        <span class="graph-legend-item"><span class="graph-legend-dot graph-legend-post"></span>Note</span>
                        <span class="graph-legend-item"><span class="graph-legend-dot graph-legend-tag"></span>Tag</span>
                    </div>
                </div>
                <script id="graph-data" type="application/json">
<!-- GRAPH_DATA -->
                </script>
            </section>

            <div class="blog-layout">
                <aside class="tag-filter" aria-label="Filter posts by tag">
                    <h2 class="tag-filter-heading">Filter by tag</h2>
                    <div class="tag-filter-list" role="group">
<!-- TAGS_FILTER -->
                    </div>
                </aside>
                <div id="blog-container" class="post-list">
<!-- BLOG_LIST -->
                    <p class="blog-empty" hidden>No posts match this tag yet.</p>
                </div>
            </div>
        </div>
    </main>

<!-- FOOTER -->
</body>
</html>
