<!DOCTYPE html>
<html lang="en">
<head>
    <title>Athletics | $SITE_NAME$</title>
    <meta name="description" content="Personal bests in distance running and strength training for $SITE_NAME$.">
    <meta property="og:title" content="Athletics | $SITE_NAME$">
    <meta property="og:description" content="Personal bests in distance running and strength training for $SITE_NAME$.">
    <meta property="og:image" content="$SITE_URL$/assets/images/athletics/running.png">
    <meta property="og:url" content="$SITE_URL$/athletics.html">
    <link rel="canonical" href="$SITE_URL$/athletics.html">
<!-- HEAD_COMMON -->
</head>
<body>
<!-- NAV -->

    <main id="main-content" class="page athletics-page">
        <header class="page-heading">
            <h1>Athletics</h1>
            <p>Personal bests across distance running and strength training.</p>
        </header>

        <img class="athletics-image" src="assets/images/athletics/running.png" alt="Aman Behera running the Pune Marathon" width="1179" height="800">

        <div class="athletics-stats">
            <section class="athletics-group" aria-labelledby="running-title">
                <h2 id="running-title">Running personal bests</h2>
                <dl class="stat-list">
                    <div class="stat-item"><dt>5K</dt><dd>22:34</dd></div>
                    <div class="stat-item"><dt>10K</dt><dd>54:07</dd></div>
                    <div class="stat-item"><dt>Half marathon (21K)</dt><dd>1:57</dd></div>
                </dl>
            </section>

            <section class="athletics-group" aria-labelledby="strength-title">
                <h2 id="strength-title">Strength personal bests</h2>
                <dl class="stat-list">
                    <div class="stat-item"><dt>Squat</dt><dd>125 kg</dd></div>
                    <div class="stat-item"><dt>Deadlift</dt><dd>140 kg</dd></div>
                    <div class="stat-item"><dt>Bench Press</dt><dd>80 kg</dd></div>
                </dl>
            </section>
        </div>
    </main>

<!-- FOOTER -->
</body>
</html>
