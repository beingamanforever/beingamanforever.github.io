<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{TITLE}} | $SITE_NAME$</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="$SITE_NAME$">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:url" content="$SITE_URL$/blog/{{SLUG}}.html">
    <meta property="article:published_time" content="{{DATE_ISO}}">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <link rel="canonical" href="{{CANONICAL}}">
<!-- HEAD_COMMON -->
</head>
<body>
<!-- NAV -->
    <div class="progress" aria-hidden="true"></div>

    <main id="main-content" class="post-layout">
        <article class="article">
            <header class="article-head">
                <p class="crumbs"><a href="$ROOT$blog.html">Writing</a><span aria-hidden="true">/</span></p>
                <h1>{{TITLE}}</h1>
                <p class="meta">{{META}}</p>
            </header>
            {{HERO}}
            <div class="post-body">
{{BODY}}
            </div>
            {{NAV}}
        </article>
        <aside class="aside" aria-label="About this post">
            {{ASIDE}}
        </aside>
    </main>

<!-- FOOTER -->
</body>
</html>
